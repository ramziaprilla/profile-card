<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card UI Design</title>
    <link rel="stylesheet" href="project1.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    
    <div class="card-box">
        <div class="image">
            <img src="image.png" alt="image.png" class="profile">
        </div>
        <div class="info-orang">
            <span class="nama">FajarLab</span> <!--kenapa pake span, kenapa ga <a> atau h1/h2/h3/h4-->
            <span class="job">MBG & Esport</span>
        </div>
        <div class="media">
            <a href="#" id="youtube" style="background-color: red;" class="link"> <!--kenapa href #-->
                <i class="bx bxl-youtube" ></i>
            </a>    
            <a href="#" id="facebook" style="background-color: rgb(11, 11, 138);" class="link"> <!--kenapa href #-->
                <i class="bx bxl-facebook"></i>
            </a>    
            <a href="#" id="twitch" style="background-color: rgb(95, 0, 95);" class="link"> <!--kenapa href #-->
                <i class="bx bxl-twitch"></i>
            </a>    
            <a href="#" id="twitter" class="link"> <!--kenapa href #-->
                <i class="bx bxl-twitter"></i>
            </a>    
        </div>

        <div class="buttons">
            <button class="button"> Subscribe</button>
            <button class="button"> Comment</button>
        </div>

        <div class="analitik">
            <div class="data">
                <i class="bx bx-heart"></i>
                <span>60k</span>
            </div>
            <div class="data">
                <i class="bx bx-message"></i>
                <span>20k</span>
            </div>
            <div class="data">
                <i class="bx bx-reply"></i>
                <span>10k</span>
            </div>
        </div>
    </div>
</body>
</html>
